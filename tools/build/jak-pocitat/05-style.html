  <style>
/* ============================================================
   VÝPOČTOVÝ LIST — hlavní komponenta téhle stránky
   zadání · hledáme · vztahy · odvození · dosazení · odpověď
   ============================================================ */
.calcsheet{
  counter-reset:csb;
  border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);
  box-shadow:var(--shadow-1);overflow:hidden;margin:1.35rem 0;
  font-variant-numeric:lining-nums tabular-nums;
}
.calcsheet + .calcsheet{margin-top:1.6rem}

/* --- hlavička listu --- */
.cs-head{
  display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;
  padding:.7rem 1.15rem;background:
    repeating-linear-gradient(0deg,transparent 0 15px,var(--grid) 15px 16px),
    repeating-linear-gradient(90deg,transparent 0 15px,var(--grid) 15px 16px),
    var(--surface-2);
  border-bottom:2px solid var(--line-strong);
}
.cs-head .cs-id{
  font-family:var(--f-cond);font-weight:700;font-size:.74rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);white-space:nowrap;
}
.cs-head .cs-topic{
  font-family:var(--f-ui);font-size:.94rem;font-weight:600;color:var(--ink);
  letter-spacing:-.012em;flex:1;min-width:120px;line-height:1.35;
}
.cs-head .cs-kind{
  font-family:var(--f-cond);font-weight:600;font-size:.66rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line-strong);
  border-radius:99px;padding:.16rem .5rem;white-space:nowrap;
}

/* --- zadání úlohy pod hlavičkou --- */
.cs-task{
  padding:.8rem 1.15rem;font-family:var(--f-ui);font-size:.95rem;line-height:1.55;
  color:var(--ink);background:var(--surface);border-bottom:1px solid var(--line);
}

/* --- blok --- */
.cs-block{
  display:grid;grid-template-columns:6.9rem minmax(0,1fr);gap:.3rem 1.1rem;
  padding:.8rem 1.15rem;border-top:1px solid var(--line);align-items:start;
}
.cs-block:first-child{border-top:0}
.cs-lbl{
  font-family:var(--f-cond);font-weight:700;font-size:.7rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);line-height:1.5;
  display:flex;align-items:baseline;gap:.4rem;padding-top:.12rem;
}
.cs-lbl::before{
  counter-increment:csb;content:counter(csb);
  font-family:var(--f-mono);font-size:.66rem;font-weight:600;letter-spacing:0;
  width:1.15rem;height:1.15rem;border-radius:50%;flex:none;
  background:var(--surface-3);color:var(--ink-3);
  display:inline-grid;place-items:center;transform:translateY(.1rem);
}
.cs-rows{display:flex;flex-direction:column;gap:.26rem;min-width:0}

/* --- řádek: symbol · hodnota · poznámka --- */
.cs-row{
  display:grid;grid-template-columns:4.6rem minmax(0,1fr) auto;
  gap:.1rem .6rem;align-items:baseline;
}
.cs-sym{
  font-family:var(--f-ui);font-style:italic;font-weight:600;font-size:1rem;
  color:var(--ink);text-align:right;white-space:nowrap;
}
.cs-sym sub,.cs-sym sup{font-style:normal}
.cs-val{
  font-family:var(--f-mono);font-size:.95rem;color:var(--ink);
  font-variant-numeric:lining-nums tabular-nums;line-height:1.6;min-width:0;
}
.cs-conv{color:var(--accent);font-weight:500}
.cs-conv::before{content:"";display:inline-block;width:.15rem}
.cs-note{
  font-family:var(--f-ui);font-size:.8rem;color:var(--ink-3);
  text-align:right;line-height:1.45;font-style:italic;
}

/* --- celořádkové zápisy (vztahy, odvození, dosazení) --- */
.cs-line{
  font-family:var(--f-mono);font-size:.97rem;line-height:1.75;color:var(--ink);
  font-variant-numeric:lining-nums tabular-nums;overflow-x:auto;
  padding:.05rem 0;white-space:nowrap;
}
.cs-line b{color:var(--accent);font-weight:600}
.cs-line em{font-style:italic;color:var(--ink-3);font-family:var(--f-ui);font-size:.86rem;white-space:normal}
.cs-line.wrap{white-space:normal}
.cs-line.units{
  color:var(--endo);font-size:.9rem;background:var(--endo-soft);
  border-radius:7px;padding:.3rem .6rem;display:block;margin-top:.15rem;
  white-space:normal;overflow-wrap:anywhere;line-height:1.55;
}
.cs-line.units b{color:var(--endo)}
.cs-hint{
  font-family:var(--f-ui);font-size:.8rem;color:var(--ink-3);line-height:1.5;
  margin-top:.18rem;font-style:italic;
}

/* --- blok „hledáme“ --- */
.cs-block.find{background:var(--surface-2)}
.cs-block.find .cs-val{color:var(--accent);font-weight:600}

/* --- blok „odpověď“ --- */
.cs-block.res{
  border-top:2px solid var(--line-strong);background:var(--surface-2);
  padding-top:.95rem;padding-bottom:.95rem;
}
.cs-block.res .cs-lbl{color:var(--accent)}
.cs-block.res .cs-lbl::before{background:var(--accent);color:var(--accent-ink)}
.cs-ans{
  font-family:var(--f-ui);font-size:.99rem;line-height:1.6;color:var(--ink);
}
.cs-hi{
  font-family:var(--f-mono);font-size:1.02rem;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:7px;padding:.1rem .45rem;
  white-space:nowrap;font-variant-numeric:lining-nums tabular-nums;
}

/* --- blok „kontrola“ --- */
.cs-block.chk{background:var(--endo-soft);border-top:1px dashed var(--line-strong)}
.cs-block.chk .cs-lbl{color:var(--endo)}
.cs-block.chk .cs-lbl::before{background:var(--endo);color:var(--surface)}
.cs-chk{font-family:var(--f-ui);font-size:.9rem;line-height:1.6;color:var(--ink-2)}

/* --- varianta „takhle ne“ --- */
.calcsheet.bad{border-color:var(--bad);background:var(--bad-soft)}
.calcsheet.bad .cs-head{border-bottom-color:var(--bad);background:var(--bad-soft)}
.calcsheet.bad .cs-head .cs-id{color:var(--bad)}
.calcsheet.bad .cs-block{border-top-color:var(--bad);opacity:.96}
.cs-flaw{
  font-family:var(--f-ui);font-size:.82rem;line-height:1.5;color:var(--bad);
  display:flex;gap:.4rem;align-items:flex-start;margin-top:.2rem;
}
.cs-flaw::before{content:"✕";font-weight:700;flex:none}
.cs-good{
  font-family:var(--f-ui);font-size:.82rem;line-height:1.5;color:var(--ok);
  display:flex;gap:.4rem;align-items:flex-start;margin-top:.2rem;
}
.cs-good::before{content:"✓";font-weight:700;flex:none}

/* --- postupné odkrývání (živý list v hero) --- */
.cs-block[data-step].is-hidden{display:none}

/* --- kompaktní varianta do dvousloupcových mřížek ---
   štítek bloku jde nad řádky, aby na formule zbyla celá šířka --- */
.calcsheet.compact .cs-block,
.vsgrid .calcsheet .cs-block{grid-template-columns:minmax(0,1fr);gap:.3rem;padding:.65rem .9rem}
.calcsheet.compact .cs-lbl,
.vsgrid .calcsheet .cs-lbl{padding-top:0}
.calcsheet.compact .cs-line,.calcsheet.compact .cs-val{font-size:.86rem}
.vsgrid .calcsheet .cs-line,.vsgrid .calcsheet .cs-val{font-size:.9rem}
.calcsheet.compact .cs-head{padding:.55rem .9rem}
.calcsheet.compact .cs-row,
.vsgrid .calcsheet .cs-row{grid-template-columns:4rem minmax(0,1fr)}
.calcsheet.compact .cs-note,
.vsgrid .calcsheet .cs-note{grid-column:2;text-align:left;margin-top:-.12rem}

/* --- mobil: jeden sloupec --- */
@media (max-width:700px){
  .cs-block{grid-template-columns:minmax(0,1fr);gap:.34rem}
  .cs-lbl{padding-top:0}
  .cs-row{grid-template-columns:3.6rem minmax(0,1fr)}
  .cs-note{grid-column:2;text-align:left;margin-top:-.1rem}
  .cs-line{font-size:.88rem}
}

/* ============================================================
   TRENAŽÉRY (rozměrová kontrola, platné číslice, řádový odhad)
   ============================================================ */
.drill{display:flex;flex-direction:column;gap:.85rem}
.drill-q{
  font-family:var(--f-ui);font-size:1.02rem;font-weight:500;line-height:1.5;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:.85rem 1rem;
}
.drill-q .big{
  display:block;font-family:var(--f-mono);font-size:1.18rem;font-weight:600;
  color:var(--accent);margin-top:.4rem;font-variant-numeric:lining-nums tabular-nums;
}
.drill-opts{display:grid;gap:.45rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.drill-opt{
  font-family:var(--f-mono);font-size:.95rem;font-weight:500;padding:.7rem .8rem;min-height:48px;
  border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);
  cursor:pointer;text-align:center;transition:background .14s,border-color .14s;
  font-variant-numeric:lining-nums tabular-nums;
}
.drill-opt:hover{background:var(--surface-2);border-color:var(--accent)}
.drill-opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.drill-opt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.drill-fb{
  font-family:var(--f-ui);font-size:.9rem;line-height:1.6;color:var(--ink-2);
  border-left:3px solid var(--line-strong);padding:.4rem .8rem;min-height:2.4rem;
}
.drill-fb.ok{border-left-color:var(--ok)}
.drill-fb.no{border-left-color:var(--bad)}
.drill-bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.drill-score{
  font-family:var(--f-mono);font-size:.88rem;font-weight:600;padding:.45rem .8rem;
  border-radius:9px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}

/* ============================================================
   TRENAŽÉR ZÁPISU — řazení řádků
   ============================================================ */
.sortlist{display:flex;flex-direction:column;gap:.4rem}
.sortitem{
  display:grid;grid-template-columns:1.9rem minmax(0,1fr) auto;gap:.7rem;align-items:center;
  padding:.6rem .8rem;border:1px solid var(--line-strong);border-radius:10px;
  background:var(--surface);text-align:left;cursor:pointer;width:100%;
  font-family:var(--f-mono);font-size:.9rem;color:var(--ink);line-height:1.45;
  transition:border-color .14s,background .14s;
}
.sortitem:hover{border-color:var(--accent);background:var(--surface-2)}
.sortitem .sn{
  width:1.9rem;height:1.9rem;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--surface-3);color:var(--ink-3);font-family:var(--f-mono);font-size:.8rem;font-weight:600;
}
.sortitem.picked .sn{background:var(--accent);color:var(--accent-ink)}
.sortitem.ok{border-color:var(--ok);background:var(--ok-soft)}
.sortitem.ok .sn{background:var(--ok);color:var(--surface)}
.sortitem.no{border-color:var(--bad);background:var(--bad-soft)}
.sortitem .sl{
  font-family:var(--f-cond);font-weight:600;font-size:.68rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
}

/* ============================================================
   PŘEVODNÍK JEDNOTEK a KARTOTÉKA VZORCŮ
   ============================================================ */
.convgrid{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.convcell{
  border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;background:var(--surface-2);
  display:flex;flex-direction:column;gap:.12rem;min-width:0;
}
.convcell .cu{
  font-family:var(--f-cond);font-weight:600;font-size:.68rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3);
}
.convcell .cv{
  font-family:var(--f-mono);font-size:1.02rem;font-weight:500;color:var(--ink);
  font-variant-numeric:lining-nums tabular-nums;overflow-x:auto;white-space:nowrap;
}
.convcell.hi{background:var(--accent-soft);border-color:var(--accent)}
.convcell.hi .cv{color:var(--accent);font-weight:600}

.fcards{display:flex;flex-direction:column;gap:.5rem;margin-top:.9rem}
.fcard{border:1px solid var(--line);border-radius:11px;background:var(--surface);overflow:hidden}
.fcard summary{
  padding:.65rem .9rem;cursor:pointer;list-style:none;display:grid;
  grid-template-columns:minmax(0,1fr) auto;gap:.3rem .8rem;align-items:baseline;min-height:44px;
}
.fcard summary::-webkit-details-marker{display:none}
.fcard summary:hover{background:var(--surface-2)}
.fcard .fname{font-family:var(--f-ui);font-weight:600;font-size:.94rem;color:var(--ink);line-height:1.35}
.fcard .farea{
  font-family:var(--f-cond);font-weight:600;font-size:.66rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;
}
.fcard .fform{
  grid-column:1/-1;font-family:var(--f-mono);font-size:1rem;font-weight:500;color:var(--accent);
  font-variant-numeric:lining-nums tabular-nums;overflow-x:auto;white-space:nowrap;padding-bottom:.1rem;
}
.fcard .fbody{
  padding:0 .9rem .85rem;display:flex;flex-direction:column;gap:.5rem;
  font-family:var(--f-ui);font-size:.89rem;line-height:1.6;color:var(--ink-2);
}
.fcard .fsym{display:grid;gap:.22rem}
.fcard .fsym div{display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:.5rem;align-items:baseline}
.fcard .fsym b{
  font-family:var(--f-ui);font-style:italic;font-weight:600;color:var(--ink);text-align:right;
}
.fcard .fwhen{color:var(--ink-2)}
.fcard .fwatch{color:var(--warn);display:flex;gap:.4rem;align-items:flex-start}
.fcard .fwatch::before{content:"⚠";flex:none}
.fcard[open] summary{border-bottom:1px solid var(--line);background:var(--surface-2)}
.fnone{
  font-family:var(--f-ui);font-size:.92rem;color:var(--ink-3);padding:1.2rem;text-align:center;
  border:1px dashed var(--line-strong);border-radius:11px;
}
.fcount{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ============================================================
   MŘÍŽKA „takhle ne / takhle ano“
   ============================================================ */
.vsgrid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(390px,100%),1fr));align-items:start}
.vscol{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.vshead{
  display:flex;align-items:center;gap:.5rem;font-family:var(--f-ui);font-weight:700;font-size:1rem;
}
.vshead.bad{color:var(--bad)} .vshead.good{color:var(--ok)}

/* ============================================================
   TISK — list se musí dát vytisknout černobíle a nerozpadnout
   ============================================================ */
@media print{
  .rail,.topbar,.toast,.quiz,.chapter-done,.paths,.timeplan,.skip,.panel .ctl,
  .panel-note,.drill-bar,.segmented,.btn{display:none!important}
  .app{display:block}
  main{padding:0;max-width:none}
  body{background:#fff;color:#000;font-size:11pt}
  section.chapter{page-break-before:always;border-top:0;padding:0 0 1.5rem}
  .worked-steps{display:flex!important}
  .calcsheet{
    break-inside:avoid;page-break-inside:avoid;box-shadow:none;
    border:1.2pt solid #000;background:#fff;border-radius:0;margin:.6rem 0;
  }
  .cs-head{background:#fff;border-bottom:1pt solid #000}
  .cs-head .cs-id,.cs-head .cs-topic,.cs-head .cs-kind{color:#000}
  .cs-block{border-top:.5pt solid #888;background:#fff!important;break-inside:avoid;page-break-inside:avoid}
  .cs-block.res{border-top:1.2pt solid #000}
  .cs-lbl,.cs-lbl::before{color:#000;background:#fff;border:0}
  .cs-lbl::before{border:.5pt solid #000}
  .cs-sym,.cs-val,.cs-line,.cs-ans,.cs-chk,.cs-note{color:#000}
  .cs-conv,.cs-line b,.cs-hi{color:#000;background:#fff;font-weight:700;text-decoration:underline}
  .cs-line.units{background:#fff;border:.5pt dashed #000;color:#000}
  .cs-line{white-space:normal}
  .callout,.tablewrap,.worked,.readout{break-inside:avoid;page-break-inside:avoid}
  a{color:#000;text-decoration:none}
}
  </style>
