<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}">
<style>:root{color-scheme:light dark}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">

<style>
/* ============================================================
   {{TITLE}} — studijní průvodce
   Barevné tokeny: světlá varianta je základ, tmavá se dopočítává
   ve třech stavech (bare :root / prefers-color-scheme / data-theme)
   ============================================================ */
:root{
  --paper:#efe8dc; --surface:#faf6ee; --surface-2:#f3ece0; --surface-3:#e8dfd0;
  --ink:#211b15; --ink-2:#5c5146; --ink-3:#8f8375;
  --line:#e0d6c6; --line-strong:#c8baa5; --grid:#e6dccb;
  --accent:#9b3320; --accent-hover:#7e2718; --accent-soft:#f6e6e0; --accent-ink:#fff7f2;
  --exo:#b54f18; --exo-soft:#fae8da;
  --endo:#216f66; --endo-soft:#e1efec;
  --ok:#3f7a34; --ok-soft:#eaf2e4;
  --bad:#a62f3b; --bad-soft:#f8e4e6;
  --warn:#8a6410; --warn-soft:#f7eeda;
  --cat1:#347f4f; --cat2:#7b4aa6; --cat3:#b4791a; --cat4:#a82c33;
  --shadow-1:0 1px 2px rgba(33,27,21,.05), 0 2px 8px rgba(33,27,21,.05);
  --shadow-2:0 2px 4px rgba(33,27,21,.06), 0 12px 30px rgba(33,27,21,.09);
  --focus:#9b3320;
  --rail:288px;

  --f-ui:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans","Segoe UI",sans-serif;
  --f-body:"Source Serif 4","Georgia",serif;
  --f-mono:"IBM Plex Mono","Consolas",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15110d; --surface:#1d1813; --surface-2:#251f19; --surface-3:#302921;
    --ink:#f0e8dc; --ink-2:#bfb2a1; --ink-3:#8f8376;
    --line:#332b23; --line-strong:#4a4036; --grid:#241e18;
    --accent:#e0785c; --accent-hover:#ef8c71; --accent-soft:#33201a; --accent-ink:#1a0f0a;
    --exo:#f08a5f; --exo-soft:#331e14;
    --endo:#6fbfae; --endo-soft:#152b27;
    --ok:#7fc08a; --ok-soft:#19291b;
    --bad:#ee7a90; --bad-soft:#301820;
    --warn:#dcae5b; --warn-soft:#2c2314;
    --cat1:#4e9464; --cat2:#9478c4; --cat3:#b8871f; --cat4:#cf5f85;
    --shadow-1:0 1px 2px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.35);
    --shadow-2:0 2px 4px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.5);
    --focus:#e0785c;
  }
}
:root[data-theme="dark"]{
  --paper:#15110d; --surface:#1d1813; --surface-2:#251f19; --surface-3:#302921;
  --ink:#f0e8dc; --ink-2:#bfb2a1; --ink-3:#8f8376;
  --line:#332b23; --line-strong:#4a4036; --grid:#241e18;
  --accent:#e0785c; --accent-hover:#ef8c71; --accent-soft:#33201a; --accent-ink:#1a0f0a;
  --exo:#f08a5f; --exo-soft:#331e14;
  --endo:#6fbfae; --endo-soft:#152b27;
  --ok:#7fc08a; --ok-soft:#19291b;
  --bad:#ee7a90; --bad-soft:#301820;
  --warn:#dcae5b; --warn-soft:#2c2314;
  --cat1:#4e9464; --cat2:#9478c4; --cat3:#b8871f; --cat4:#cf5f85;
  --shadow-1:0 1px 2px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.35);
  --shadow-2:0 2px 4px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.5);
  --focus:#e0785c;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:17px;line-height:1.7;
  font-variant-numeric:oldstyle-nums;
}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}

/* ---------- Typografie ---------- */
h1,h2,h3,h4{font-family:var(--f-ui);text-wrap:balance;margin:0;line-height:1.18;letter-spacing:-.018em}
h1{font-size:clamp(2rem,1.2rem + 3vw,3.15rem);font-weight:700;letter-spacing:-.03em}
h2{font-size:clamp(1.5rem,1.1rem + 1.5vw,2.1rem);font-weight:700}
h3{font-size:1.22rem;font-weight:600;letter-spacing:-.012em}
h4{font-size:1.02rem;font-weight:600}
p{margin:0}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
.eyebrow{
  font-family:var(--f-cond);font-weight:600;font-size:.76rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-3);font-variant-numeric:lining-nums tabular-nums;
}
.lead{font-size:1.12rem;color:var(--ink-2);text-wrap:pretty}
.mono,code,kbd{font-family:var(--f-mono);font-variant-numeric:lining-nums tabular-nums}
code{background:var(--surface-3);padding:.08em .34em;border-radius:4px;font-size:.88em}
.num{font-family:var(--f-mono);font-variant-numeric:lining-nums tabular-nums}
sub,sup{font-size:.68em;line-height:0}

/* Chemický zápis a veličiny */
.chem{font-family:var(--f-ui);font-weight:500;white-space:nowrap;font-variant-numeric:lining-nums}
.q{font-family:var(--f-ui);font-style:italic;font-weight:500;white-space:nowrap}
.eq{
  font-family:var(--f-mono);font-size:1rem;background:var(--surface-2);
  border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:.85rem 1.1rem;margin:0;
  overflow-x:auto;font-variant-numeric:lining-nums tabular-nums;line-height:1.65;
}
.eq b{color:var(--accent);font-weight:600}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
@media (max-width:1099px){ .app{grid-template-columns:minmax(0,1fr)} }

/* Levá lišta */
.rail{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-right:1px solid var(--line);
  padding:1.4rem 1rem 2.5rem;display:flex;flex-direction:column;gap:1.1rem;
}
.rail-brand{display:flex;flex-direction:column;gap:.3rem;padding:0 .45rem}
.rail-brand .mark{
  font-family:var(--f-cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  font-size:.72rem;color:var(--accent);
}
.rail-brand .name{font-family:var(--f-ui);font-weight:700;font-size:1.02rem;letter-spacing:-.02em;line-height:1.25}
.rail-brand .sub{font-family:var(--f-ui);font-size:.78rem;color:var(--ink-3)}

.meter{padding:.7rem .45rem 0;display:flex;flex-direction:column;gap:.42rem}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-ui);font-size:.76rem;color:var(--ink-3)}
.meter-top b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meter-bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.meter-fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1)}

.rail nav{display:flex;flex-direction:column;gap:1px}
.rail nav a{
  display:grid;grid-template-columns:1.65rem 1fr auto;align-items:center;gap:.5rem;
  padding:.5rem .5rem;border-radius:8px;text-decoration:none;color:var(--ink-2);
  font-family:var(--f-ui);font-size:.875rem;line-height:1.3;min-height:40px;
  transition:background .15s,color .15s;
}
.rail nav a:hover{background:var(--surface-2);color:var(--ink)}
.rail nav a[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.rail nav a[aria-current="true"] .idx{color:var(--accent)}
.rail nav a .idx{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rail nav a .tick{
  width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line-strong);
  display:grid;place-items:center;flex:none;
}
.rail nav a.done .tick{background:var(--ok);border-color:var(--ok)}
.rail nav a.done .tick::after{content:"";width:7px;height:4px;border-left:1.7px solid var(--surface);border-bottom:1.7px solid var(--surface);transform:rotate(-45deg) translate(.5px,-1px)}
.rail-tools{display:flex;gap:.45rem;padding:0 .45rem;margin-top:auto}

/* Mobilní / tabletová hlavička */
.topbar{display:none}
@media (max-width:1099px){
  .rail{display:none}
  .topbar{
    display:block;position:sticky;top:0;z-index:40;background:var(--surface);
    border-bottom:1px solid var(--line);box-shadow:var(--shadow-1);
  }
  .topbar-row{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem}
  .topbar-row .name{font-family:var(--f-ui);font-weight:700;font-size:.95rem;letter-spacing:-.02em;flex:1;min-width:0}
  .topbar-row .name > span{display:block;font-weight:400;font-size:.74rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar-row .name > span span{display:inline}
  .chiprow{display:flex;gap:.4rem;overflow-x:auto;padding:0 .9rem .6rem;scrollbar-width:none}
  .chiprow::-webkit-scrollbar{display:none}
  .chiprow a{
    flex:none;padding:.45rem .8rem;border-radius:99px;background:var(--surface-2);
    border:1px solid var(--line);font-family:var(--f-ui);font-size:.8rem;
    text-decoration:none;color:var(--ink-2);white-space:nowrap;min-height:34px;display:flex;align-items:center;gap:.35rem;
  }
  .chiprow a[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .chiprow a.done::before{content:"✓";font-weight:700;color:var(--ok)}
  .chiprow a[aria-current="true"].done::before{color:var(--accent-ink)}
  .topbar .meter-bar{height:3px;border-radius:0}
}

/* Obsahový sloupec */
main{padding:0 clamp(1rem,4vw,3.5rem) 6rem;max-width:1180px;width:100%;margin:0 auto}
section.chapter{padding:clamp(2.5rem,5vw,4.5rem) 0;border-top:1px solid var(--line)}
section.chapter:first-of-type{border-top:0}
.prose{max-width:min(100%,100ch);display:flex;flex-direction:column;gap:1.05rem}
.prose > h3{margin-top:1.1rem}
.wide{max-width:none}

/* ---------- Tlačítka ---------- */
.btn{
  font-family:var(--f-ui);font-size:.875rem;font-weight:600;line-height:1;
  padding:.7rem 1.05rem;min-height:44px;border-radius:9px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;gap:.45rem;transition:background .15s,border-color .15s,transform .08s;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-sm{padding:.45rem .7rem;min-height:36px;font-size:.8rem}
.btn-icon{width:44px;min-height:44px;padding:0;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- Panely ---------- */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-1);overflow:hidden;margin:1.9rem 0;
}
.panel-head{
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  padding:.85rem 1.2rem;border-bottom:1px solid var(--line);
  background:
    repeating-linear-gradient(0deg,transparent 0 15px,var(--grid) 15px 16px),
    repeating-linear-gradient(90deg,transparent 0 15px,var(--grid) 15px 16px),
    var(--surface-2);
}
.panel-head h3{flex:1;min-width:0;font-size:1rem}
.panel-body{padding:1.2rem}
.panel-note{
  padding:.75rem 1.2rem;border-top:1px solid var(--line);background:var(--surface-2);
  font-family:var(--f-ui);font-size:.83rem;color:var(--ink-2);
}
.tag{
  font-family:var(--f-cond);font-weight:600;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.25rem .55rem;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;
}
.tag.exo{background:var(--exo-soft);color:var(--exo)}
.tag.endo{background:var(--endo-soft);color:var(--endo)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

/* Výklopné bloky (definice, pozor, příklad) */
.callout{
  border:1px solid var(--line);border-radius:12px;padding:1rem 1.15rem;
  display:flex;flex-direction:column;gap:.55rem;background:var(--surface);
}
.callout > .eyebrow{display:flex;align-items:center;gap:.45rem}
.callout p{font-size:.98rem}
.callout.def{border-left:3px solid var(--accent);background:var(--surface)}
.callout.def > .eyebrow{color:var(--accent)}
.callout.warn{border-left:3px solid var(--warn);background:var(--warn-soft)}
.callout.warn > .eyebrow{color:var(--warn)}
.callout.tip{border-left:3px solid var(--endo);background:var(--endo-soft)}
.callout.tip > .eyebrow{color:var(--endo)}

/* Pojem v textu */
.term{
  font-family:var(--f-ui);font-weight:600;font-size:.96em;color:var(--ink);
  border-bottom:2px solid var(--accent-soft);
}

/* Řešený příklad */
.worked{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.worked-head{
  padding:.8rem 1.1rem;background:var(--surface-2);border-bottom:1px solid var(--line);
  display:flex;gap:.6rem;align-items:flex-start;
}
.worked-head .eyebrow{color:var(--accent);flex:none;padding-top:.18rem}
.worked-head p{font-family:var(--f-ui);font-size:.95rem;font-weight:500}
.worked-body{padding:1.1rem}
.worked-steps{display:none;flex-direction:column;gap:.9rem;margin-top:1rem;
  padding-top:1rem;border-top:1px dashed var(--line-strong)}
.worked.open .worked-steps{display:flex}
.worked [data-reveal] .chev{transition:transform .3s cubic-bezier(.4,0,.2,1)}
.worked.open [data-reveal] .chev{transform:rotate(180deg)}
.step{display:grid;grid-template-columns:1.7rem 1fr;gap:.65rem;align-items:start}
.step-n{
  width:1.7rem;height:1.7rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-family:var(--f-mono);font-size:.78rem;font-weight:600;display:grid;place-items:center;
}
.step-b{display:flex;flex-direction:column;gap:.45rem;font-size:.98rem;min-width:0}
.result{
  font-family:var(--f-mono);font-size:1.02rem;font-weight:600;padding:.7rem .95rem;
  border-radius:9px;background:var(--accent-soft);color:var(--accent);display:inline-block;
}

/* ---------- Tabulky ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:.875rem}
thead th{
  text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--line-strong);
  font-family:var(--f-cond);font-weight:600;font-size:.74rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap;background:var(--surface-2);
  position:sticky;top:0;
}
tbody td{padding:.55rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}

/* ---------- Kvíz ---------- */
.quiz{margin:2rem 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);
  box-shadow:var(--shadow-1);overflow:hidden}
.quiz-toggle{
  width:100%;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
  padding:.95rem 1.15rem;min-height:60px;background:var(--surface-2);
  border:0;border-bottom:1px solid transparent;cursor:pointer;text-align:left;
  font-family:var(--f-ui);color:var(--ink);-webkit-tap-highlight-color:transparent;
  transition:background .15s,border-color .2s;
}
.quiz-toggle:hover{background:var(--surface-3)}
.quiz.open .quiz-toggle{border-bottom-color:var(--line)}
.qt-title{flex:1;min-width:140px;font-size:1.02rem;font-weight:600;letter-spacing:-.012em;line-height:1.3}
.qt-meta{font-family:var(--f-cond);font-weight:600;font-size:.74rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.qt-score{display:none}
.qt-score.show{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:600;
  font-family:var(--f-ui);white-space:nowrap}
.chev{flex:none;color:var(--ink-3);transition:transform .32s cubic-bezier(.4,0,.2,1)}
.quiz.open .chev{transform:rotate(180deg);color:var(--accent)}
.quiz-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.4,0,.2,1)}
.quiz.open .quiz-wrap{grid-template-rows:1fr}
.quiz-inner{overflow:hidden;min-height:0}
.quiz-pad{padding:1.15rem}
.qcard{
  border:1px solid var(--line);border-radius:12px;background:var(--surface-2);
  padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.85rem;margin-bottom:.85rem;
  transition:border-color .2s;
}
.qcard.correct{border-color:var(--ok);border-left:3px solid var(--ok)}
.qcard.wrong{border-color:var(--bad);border-left:3px solid var(--bad)}
.qtext{font-family:var(--f-ui);font-size:1rem;font-weight:500;line-height:1.5;display:flex;gap:.6rem}
.qtext .qn{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-3);flex:none;padding-top:.22rem;font-weight:600}
.qtext .qbody{min-width:0}
.opts{display:flex;flex-direction:column;gap:.4rem}
.opt{
  display:flex;gap:.65rem;align-items:flex-start;padding:.6rem .75rem;min-height:44px;
  border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--surface);
  font-family:var(--f-ui);font-size:.92rem;line-height:1.45;transition:background .14s,border-color .14s;
  -webkit-tap-highlight-color:transparent;
}
.opt:hover{background:var(--surface-2)}
.opt input{margin:.28rem 0 0;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt .otext{min-width:0;flex:1}
.opt .mk{font-family:var(--f-ui);font-weight:700;flex:none;opacity:0;font-size:1rem}
.quiz.checked .opt{cursor:default}
.quiz.checked .opt input{pointer-events:none}
.opt.is-correct{background:var(--ok-soft);border-color:var(--ok)}
.opt.is-correct .mk{opacity:1;color:var(--ok)}
.opt.is-wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.is-wrong .mk{opacity:1;color:var(--bad)}
.numin{
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-family:var(--f-ui);font-size:.92rem;
}
.numin input{
  font-family:var(--f-mono);font-size:1rem;padding:.55rem .7rem;min-height:44px;width:9.5rem;
  border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.numin input:disabled{background:var(--surface-2);color:var(--ink-2)}
.numin .unit{font-family:var(--f-mono);font-size:.9rem;color:var(--ink-2)}
.explain{
  display:none;border-radius:10px;padding:.85rem 1rem;background:var(--surface-2);
  border:1px solid var(--line);font-size:.96rem;flex-direction:column;gap:.5rem;
}
.qcard.revealed .explain{display:flex}
.explain .eyebrow{color:var(--accent)}
.explain .verdict{font-family:var(--f-ui);font-weight:600;font-size:.92rem;display:flex;gap:.4rem;align-items:center}
.qcard.correct .explain{background:var(--ok-soft);border-color:var(--ok)}
.qcard.correct .verdict{color:var(--ok)}
.qcard.wrong .explain{background:var(--bad-soft);border-color:var(--bad)}
.qcard.wrong .verdict{color:var(--bad)}
.quiz-foot{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.4rem}
.score{
  font-family:var(--f-ui);font-size:.9rem;font-weight:600;padding:.5rem .85rem;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);display:none;align-items:center;gap:.5rem;
}
.score.show{display:inline-flex}
.score .pct{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- Ovládací prvky widgetů ---------- */
.ctl{display:flex;flex-direction:column;gap:.4rem;min-width:0}
.ctl label{font-family:var(--f-cond);font-weight:600;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.ctl .val{font-family:var(--f-mono);font-size:.95rem;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;cursor:pointer;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--surface-3);border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--accent);
  border:3px solid var(--surface);box-shadow:var(--shadow-1);margin-top:-11px;
}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--surface-3);border:1px solid var(--line)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:var(--shadow-1)}
.segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.segmented button{
  font-family:var(--f-ui);font-size:.84rem;font-weight:600;padding:.45rem .85rem;min-height:38px;
  border:0;border-radius:7px;background:transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap;
}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.segmented.exoendo button[aria-pressed="true"][data-v="exo"]{background:var(--exo);color:var(--accent-ink)}
.segmented.exoendo button[aria-pressed="true"][data-v="endo"]{background:var(--endo);color:var(--accent-ink)}
select,input[type=search]{
  font-family:var(--f-ui);font-size:.9rem;padding:.55rem .7rem;min-height:44px;
  border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink);width:100%;
}
.grid2{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid3{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}

/* Odečtové dlaždice */
.readout{
  border:1px solid var(--line);border-radius:10px;padding:.7rem .85rem;background:var(--surface-2);
  display:flex;flex-direction:column;gap:.2rem;min-width:0;
}
.readout .k{font-family:var(--f-cond);font-weight:600;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.readout .v{font-family:var(--f-mono);font-size:1.18rem;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.readout .h{font-family:var(--f-ui);font-size:.76rem;color:var(--ink-3)}
.readout.pos .v{color:var(--endo)} .readout.neg .v{color:var(--exo)}

svg{display:block;max-width:100%;height:auto}
.svgwrap{overflow-x:auto;background:
  repeating-linear-gradient(0deg,transparent 0 19px,var(--grid) 19px 20px),
  repeating-linear-gradient(90deg,transparent 0 19px,var(--grid) 19px 20px),
  var(--surface);border:1px solid var(--line);border-radius:11px;padding:.5rem}
.legend{display:flex;flex-wrap:wrap;gap:.5rem .95rem;font-family:var(--f-ui);font-size:.82rem;color:var(--ink-2);margin-top:.7rem}
.legend .li{display:flex;align-items:center;gap:.4rem}
.legend .sw{width:14px;height:4px;border-radius:2px;flex:none}
.legend .sw.dot{width:10px;height:10px;border-radius:50%}

/* ---------- Hero ---------- */
.hero{padding:clamp(2rem,4vw,3.4rem) 0 0}
.hero-top{display:flex;flex-direction:column;gap:.9rem;max-width:min(100%,100ch)}
.hero h1{margin-top:.2rem}
.hero-meta{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.4rem}
.hero-fig{margin-top:2rem}

/* Mapa osnovy */
.syllabus{display:grid;gap:.5rem;margin-top:1.2rem}
.syl-row{
  display:grid;grid-template-columns:2.2rem 1fr auto;gap:.8rem;align-items:center;
  padding:.7rem .85rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  text-decoration:none;color:var(--ink);font-family:var(--f-ui);font-size:.92rem;line-height:1.4;
  transition:border-color .15s,background .15s;
}
.syl-row:hover{border-color:var(--accent);background:var(--surface-2)}
.syl-row .b{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);font-weight:600}
.syl-row .go{font-family:var(--f-cond);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}

/* Tahák */
.cheat{display:grid;gap:.85rem;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));margin-top:1.2rem}
.cheat-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.6rem}
.cheat-card h4{color:var(--accent)}
.cheat-card ul{margin:0;padding-left:1.1rem;font-family:var(--f-ui);font-size:.88rem;line-height:1.6;color:var(--ink-2)}
.cheat-card li{margin-bottom:.3rem}
.cheat-card .eq{font-size:.92rem;padding:.6rem .8rem}

/* Slovníček */
.gloss{display:grid;gap:.55rem;margin-top:1.2rem}
.gitem{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.gitem summary{
  padding:.75rem 1rem;cursor:pointer;font-family:var(--f-ui);font-weight:600;font-size:.95rem;
  display:flex;align-items:center;gap:.6rem;list-style:none;min-height:44px;
}
.gitem summary::-webkit-details-marker{display:none}
.gitem summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);color:var(--ink-3);font-size:1.1rem;font-weight:400}
.gitem[open] summary::after{content:"−"}
.gitem summary:hover{background:var(--surface-2)}
.gitem .gbody{padding:0 1rem 1rem;font-size:.97rem;color:var(--ink-2);display:flex;flex-direction:column;gap:.5rem}
.gitem .gbody .unit-badge{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);background:var(--accent-soft);padding:.2rem .5rem;border-radius:5px;align-self:flex-start}

/* Konec kapitoly */
.chapter-done{
  display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-top:2rem;padding:1rem 1.15rem;
  border:1px dashed var(--line-strong);border-radius:12px;background:var(--surface-2);
  font-family:var(--f-ui);font-size:.9rem;color:var(--ink-2);
}
.chapter-done .grow{flex:1;min-width:120px}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(140%);
  background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:.88rem;font-weight:500;
  padding:.75rem 1.15rem;border-radius:10px;box-shadow:var(--shadow-2);z-index:90;
  transition:transform .3s cubic-bezier(.4,0,.2,1);pointer-events:none;max-width:90vw;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;z-index:100;background:var(--accent);color:var(--accent-ink);padding:.7rem 1rem;border-radius:0 0 8px 0;font-family:var(--f-ui);font-weight:600}
.skip:focus{left:0}

/* ---------- Rozcestník dvou cest ---------- */
.paths{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin:2.2rem 0 .5rem}
.path{
  display:flex;flex-direction:column;gap:.55rem;padding:1.15rem 1.25rem;text-decoration:none;
  border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);color:var(--ink);
  transition:border-color .16s,transform .1s,box-shadow .16s;
}
.path:hover{border-color:var(--accent);box-shadow:var(--shadow-1);transform:translateY(-1px)}
.path .pk{display:flex;align-items:center;gap:.5rem}
.path .pt{font-family:var(--f-ui);font-weight:700;font-size:1.12rem;letter-spacing:-.02em}
.path .pd{font-family:var(--f-ui);font-size:.88rem;color:var(--ink-2);line-height:1.5}
.path .pgo{font-family:var(--f-cond);font-weight:600;font-size:.75rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);margin-top:.1rem}
.path.primary{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- Řešený příklad v rychloprůchodu ---------- */
.exgrid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:1.1rem}
.exbox{
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;
  background:var(--surface);padding:1rem 1.15rem;margin-top:1.1rem;
  display:flex;flex-direction:column;gap:.6rem;min-width:0;
}
.exgrid .exbox{margin-top:0}
.exbox > .eyebrow{color:var(--accent)}
.exbox .task{font-family:var(--f-ui);font-size:.95rem;font-weight:500;line-height:1.55}
.exbox .calc{
  font-family:var(--f-mono);font-size:.92rem;line-height:1.9;background:var(--surface-2);
  border:1px solid var(--line);border-radius:9px;padding:.75rem .9rem;overflow-x:auto;
  font-variant-numeric:lining-nums tabular-nums;
}
.exbox .calc b{color:var(--ink)}
.exbox .res{
  font-family:var(--f-mono);font-size:1rem;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:8px;padding:.5rem .8rem;align-self:flex-start;
}
.exbox .out{font-family:var(--f-ui);font-size:.9rem;color:var(--ink-2);line-height:1.55}

/* ---------- Rychloprůchod: bloky ---------- */
.timeplan{display:flex;flex-wrap:wrap;gap:.4rem;margin:1.3rem 0 .4rem}
.timeplan a{
  display:flex;align-items:center;gap:.45rem;padding:.45rem .7rem;min-height:38px;
  border:1px solid var(--line);border-radius:99px;background:var(--surface);
  font-family:var(--f-ui);font-size:.82rem;color:var(--ink-2);text-decoration:none;white-space:nowrap;
}
.timeplan a:hover{border-color:var(--accent);color:var(--ink)}
.timeplan a b{font-family:var(--f-mono);font-size:.76rem;color:var(--accent);font-variant-numeric:tabular-nums}

.sblock{border-top:1px solid var(--line);padding:1.9rem 0 .4rem;scroll-margin-top:110px}
.sblock:first-of-type{border-top:0}
.sb-head{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap;margin-bottom:.85rem}
.sb-min{
  font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--accent);
  background:var(--accent-soft);padding:.28rem .6rem;border-radius:6px;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.sb-head h3{flex:1;min-width:180px;font-size:1.24rem}
.sb-grid{display:grid;gap:.9rem;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
@media (max-width:820px){ .sb-grid{grid-template-columns:minmax(0,1fr)} }
.say{display:flex;flex-direction:column;gap:.7rem;font-size:1.02rem;line-height:1.65}
.say > .eyebrow{color:var(--accent)}
.say p{text-wrap:pretty}
.aside{display:flex;flex-direction:column;gap:.7rem}
.board{
  border:1px solid var(--line-strong);border-radius:11px;background:var(--surface-2);
  padding:.85rem 1rem;display:flex;flex-direction:column;gap:.45rem;
}
.board .eyebrow{color:var(--ink-3)}
.board .bq{font-family:var(--f-mono);font-size:1rem;line-height:1.6;color:var(--ink);font-variant-numeric:tabular-nums}
.trap{
  border:1px solid var(--warn);border-left:3px solid var(--warn);border-radius:11px;
  background:var(--warn-soft);padding:.8rem 1rem;display:flex;flex-direction:column;gap:.4rem;
}
.trap .eyebrow{color:var(--warn)}
.trap p{font-family:var(--f-ui);font-size:.88rem;line-height:1.55;color:var(--ink-2)}
.tchips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.9rem}
.tchips span{
  font-family:var(--f-mono);font-size:.74rem;padding:.22rem .5rem;border-radius:5px;
  background:var(--surface-3);color:var(--ink-2);
}
.tchips b{font-family:var(--f-cond);font-weight:600;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);align-self:center;margin-right:.15rem}

/* Osm vět / kontrolní seznam */
.eight{display:grid;gap:.5rem;counter-reset:e;margin-top:1.1rem}
.eight li{
  list-style:none;display:grid;grid-template-columns:1.9rem 1fr;gap:.7rem;align-items:start;
  padding:.75rem .9rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  font-family:var(--f-ui);font-size:.95rem;line-height:1.5;
}
.eight li::before{
  counter-increment:e;content:counter(e);width:1.9rem;height:1.9rem;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:.8rem;
  font-weight:600;display:grid;place-items:center;
}
.eight{padding:0;margin-left:0}
.covermap{display:grid;gap:.4rem;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));margin-top:1.1rem}
.covermap a{
  display:flex;align-items:center;gap:.5rem;padding:.5rem .65rem;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);text-decoration:none;color:var(--ink-2);
  font-family:var(--f-ui);font-size:.84rem;line-height:1.35;
}
.covermap a:hover{border-color:var(--accent);color:var(--ink)}
.covermap a::before{content:"✓";color:var(--ok);font-weight:700;flex:none}

hr.rule{border:0;border-top:1px solid var(--line);margin:2.2rem 0}
</style>
</head>

<div class="app">

  <!-- ============ LEVÁ LIŠTA ============ -->
  <aside class="rail">
    <div class="rail-brand">
      <span class="mark">Chemie</span>
      <span class="name">{{TITLE}}</span>
      <span class="sub">Studijní průvodce s procvičováním</span>
    </div>
    <div class="meter">
      <div class="meter-top"><span>Splněno kapitol</span><b><span id="mDone">0</span>&thinsp;/&thinsp;<span data-tot>10</span></b></div>
      <div class="meter-bar"><div class="meter-fill" id="mFill"></div></div>
    </div>
    <nav id="railNav" aria-label="Kapitoly"></nav>
    <div class="rail-tools">
      <button class="btn btn-sm" id="themeBtn" type="button" aria-label="Přepnout světlý a tmavý režim"><span id="themeIcon" style="display:inline-flex"></span><span id="themeLbl">Tmavý</span></button>
      <button class="btn btn-sm" id="resetBtn" type="button">Vynulovat</button>
    </div>
  </aside>

  <!-- ============ HLAVIČKA (tablet / mobil) ============ -->
  <div class="topbar">
    <div class="topbar-row">
      <div class="name">{{SHORT}}<span>Studijní průvodce · <span id="mDone2">0</span>/<span data-tot>10</span> kapitol</span></div>
      <button class="btn btn-icon" id="themeBtn2" type="button" aria-label="Přepnout světlý a tmavý režim"></button>
    </div>
    <div class="chiprow" id="chipNav"></div>
    <div class="meter-bar"><div class="meter-fill" id="mFill2"></div></div>
  </div>

  <main id="obsah">
